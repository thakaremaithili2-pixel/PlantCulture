{% extends 'base.html' %}
{% block content %}
<div class="text-center py-5">
  <div style="font-size:4rem;">🌱</div>
  <h1 class="mt-3" style="color:#2d6a27;">🍀Welcome to PlantCulture 🍀</h1>
  <p class="lead text-muted">From soil to soul — find the bloom that says it all.</p>
  {% if user.is_authenticated %}
    <a href="{% url 'products' %}" class="btn btn-success btn-lg mt-2">Browse Products</a>
  {% else %}
    <a href="{% url 'login' %}" class="btn btn-success btn-lg mt-2 mr-2">Login</a>
    <a href="{% url 'register' %}" class="btn btn-outline-success btn-lg mt-2">Register</a>
  {% endif %}
</div>
{% endblock %}
