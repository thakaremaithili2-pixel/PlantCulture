{% extends 'base.html' %}
{% block content %}
<h2 style="color:#2d6a27;">🌿 Checkout</h2>
<div class="row">
  <div class="col-md-7">
    <div class="card p-4">
      <h5 class="mb-3">Shipping Details</h5>
      {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
      <form method="POST">
        {% csrf_token %}
        <div class="form-group">
          <label>Shipping Address</label>
          <textarea name="address" class="form-control" rows="3" placeholder="House no., Street, City, State, PIN" required></textarea>
        </div>
        <div class="form-group">
          <label>Phone Number</label>
          <input type="tel" name="phone" class="form-control" placeholder="10-digit mobile number" required>
        </div>
        <button type="submit" class="btn btn-success btn-block">Place Order 🌸</button>
      </form>
    </div>
  </div>
  <div class="col-md-5">
    <div class="card p-4">
      <h5 class="mb-3">Order Summary</h5>
      {% for item in cart_items %}
      <div class="d-flex justify-content-between mb-1" style="font-size:.9rem;">
        <span>{{ item.product.name }} × {{ item.quantity }}</span>
        <span>₹{{ item.subtotal }}</span>
      </div>
      {% endfor %}
      <hr>
      <div class="d-flex justify-content-between font-weight-bold">
        <span>Total</span><span>₹{{ total }}</span>
      </div>
    </div>
  </div>
</div>
{% endblock %}
